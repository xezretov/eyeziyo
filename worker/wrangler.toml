name = "tatuziyo-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Frontend + API bitta domenda: tuit.eyeziyo.uz
routes = [
  { pattern = "tuit.eyeziyo.uz", custom_domain = true }
]

# Admin panel statik fayllari (../web) shu Worker'dan beriladi.
# /api/* har doim Worker'ga tushadi; noma'lum yo'llar index.html (SPA).
[assets]
directory = "../web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
GEMINI_MODEL = "gemini-2.5-flash-lite"
# Audiotap serverning PUBLIC manzili (oxirida slash yo'q).
# Webhook payload "http://localhost/api/recordings/..." beradi — origin shunga almashtiriladi.
# Audiotap Tailscale Funnel orqali ochiq (2026-09-04 da real webhook payloadidan olindi).
AUDIOTAP_BASE_URL = "https://soft-mixer.taila38ca0.ts.net/api"
# Faqat shu profildagi artifact qayta ishlanadi, qolganlari "skipped".
# Audiotap odatda "speech" (opus, kichik) va "original" (flac, katta) yuboradi.
TARGET_PROFILE = "speech"
# Shu hajmdan katta fayl Worker xotirasiga sig'maydi (limit 128MB).
MAX_INGEST_MB = "90"
# Uzun Ogg Opus yozuv STT uchun shu uzunlikdagi bo'laklarga bo'linadi (src/ogg.ts).
# Bitta so'rovda 80 daqiqalik audio ishonchsiz (token limiti / takrorlash sikli).
# 2026-09-24: 300 s. 10 daqiqalik bo'lak o'zbek nutqida 4096 token chiqishga sig'maydi (~3 token/so'z,
# 1300+ so'z) — MAX_TOKENS "sikl" deb qayta ishlanib pul ketardi; 5 daqiqada ≤ ~2500 token, sikl ham kam.
STT_CHUNK_SEC = "300"
# STT (nutqni matnga) modeli. flash-lite uzun bo'laklarda takrorlash sikliga tushadi
# yoki RECITATION bilan bo'sh qaytaradi (2026-09-15 tajribasi) — flash barqaror.
# Baholash/polish GEMINI_MODEL da qoladi.
STT_MODEL = "gemini-2.5-flash"
# STT rejimi. "manual" (default): audio yuklab olinadi, lekin pullik Gemini STT faqat admin
# o'qituvchi/fan/mavzuni biriktirgandan keyin boshlanadi. "auto": har yozuv darhol STT.
# 2026-09-22: audiotap har 1.5 soatda 80 daq yozuv yuboradi (dars bo'lmasa ham) — 26 yozuv
# avtomatik STT + takroriy o'tishlar bilan ~$24 ketgan.
STT_MODE = "manual"
# Kunlik STT limiti (audio daqiqa, 0 = cheksiz). Oshsa yozuv "Biriktirish kutilmoqda" da qoladi,
# "Qayta ishlash → transkripsiya" limitni chetlab o'tadi.
STT_DAILY_LIMIT_MIN = "600"
# STT Gemini Batch API orqali (kirish/chiqish 50% narx). Bo'laklar Files API ga yuklanadi, bitta job;
# cron har 10 daqiqada tekshiradi, natija odatda 10–60 daqiqada (kafolat 24 soat). "off" — sinxron.
STT_BATCH = "on"
# Batch shu soatdan uzoq PENDING/RUNNING qolsa bekor qilinib sinxron STT bilan davom etadi.
STT_BATCH_MAX_HOURS = "36"

# Secrets — `wrangler secret put <NAME>`, HECH QACHON bu faylga yozilmaydi:
#   GEMINI_API_KEY
#   JWT_SECRET                 (openssl rand -hex 32)
#   AUDIOTAP_WEBHOOK_SECRET    (audiotap webhook target'idagi secret bilan bir xil)

[[d1_databases]]
binding = "DB"
database_name = "tatuziyo-db"
database_id = "dff04efd-ec99-47ff-91cb-c7f0fa4e5ac1"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "tatuziyo-audio"

[[queues.producers]]
binding = "JOBS"
queue = "tatuziyo-jobs"

# Bitta xabar = bitta yozuv (audio katta, batch qilinmaydi)
[[queues.consumers]]
queue = "tatuziyo-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "tatuziyo-jobs-dlq"

# Osilib qolgan ishlarni tiklash (har 10 daqiqada)
[triggers]
crons = ["*/10 * * * *"]

# Worker loglari dashboard'da ko'rinsin (queue/cron xatolarini tekshirish uchun).
[observability]
enabled = true
